apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-api
  labels: {app: heart-disease-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: heart-disease-api}
  template:
    metadata:
      labels: {app: heart-disease-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: heart-disease-api:1.0.0
          imagePullPolicy: IfNotPresent   # image is built into the local cluster
          ports:
            - containerPort: 8000
          env:
            - {name: LOG_LEVEL, value: INFO}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
